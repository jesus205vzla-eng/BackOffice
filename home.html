<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=login.html">
  <meta name="robots" content="noindex">
  <title>Panel · Game List Backoffice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="login.html">Game List</a>
    <a class="btn btn--ghost" href="login.html">Cerrar sesión</a>
  </header>

  <main class="panel">
    <h1>Resumen de la plataforma</h1>
    <p>Esto es lo que pasa hoy en Game List.</p>

    <ul class="estadisticas">
      <li><strong>1,284</strong><span>Jugadores activos</span></li>
      <li><strong>56</strong><span>Partidas hoy</span></li>
      <li><strong>38</strong><span>Juegos en catálogo</span></li>
    </ul>

    <div class="tabla">
      <table>
        <caption>Últimos juegos agregados</caption>
        <thead>
          <tr>
            <th scope="col">Juego</th>
            <th scope="col">Plataforma</th>
            <th scope="col">Calificación</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Neon Drift</td>
            <td>PC</td>
            <td>9.1</td>
          </tr>
          <tr>
            <td>Castle Quest</td>
            <td>Switch</td>
            <td>8.4</td>
          </tr>
          <tr>
            <td>Pixel Racers</td>
            <td>Móvil</td>
            <td>7.8</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
