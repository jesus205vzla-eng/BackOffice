<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inicia sesión en el backoffice de Game List.">
  <title>Iniciar sesión · Game List Backoffice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al formulario</a>
  <div class="auth auth--login">
    <header class="auth__brand">
      <a class="brand" href="login.html">Game List</a>
      <div class="auth__pitch">
        <h2>Todos los juegos y sus calificaciones en un solo catálogo.</h2>
        <p>Agrega títulos nuevos, revisa qué tan bien calificados están y mantén el catálogo al día.</p>
      </div>
    </header>

    <main class="auth__main" id="contenido">
      <section class="card">
        <h1>Iniciar sesión</h1>

        <form class="form" action="home.html">
          <div class="correo">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" autocomplete="email" placeholder="nombre@gamelist.com" required>
          </div>
          <div class="contrasena">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
          <button class="btn" type="submit">Entrar</button>
        </form>

        <p class="crearCuenta">¿Aún no tienes cuenta? <a href="register.html">Crear cuenta</a></p>
      </section>
    </main>
  </div>
</body>
</html>
