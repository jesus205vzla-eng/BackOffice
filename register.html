<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea tu cuenta en el backoffice de Game List.">
  <title>Crear cuenta · Game List Backoffice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al formulario</a>
  <div class="auth">
    <header class="auth__brand">
      <a class="brand" href="login.html">Game List</a>
      <div class="auth__pitch">
        <h2>Suma tu cuenta al equipo.</h2>
        <p>Con ella podrás administrar todos tus proyectos de videojuegos.</p>
      </div>
    </header>

    <main class="auth__main" id="contenido">
      <section class="card">
        <h1>Crear cuenta</h1>
        <p class="card__lead">Solo te tomará un minuto.</p>

        <p class="mensaje" id="mensaje" role="alert" hidden></p>

        <form class="form" id="formulario-registro">
          <div class="nombre">
            <label for="name">Nombre completo</label>
            <input id="name" type="text" autocomplete="name" minlength="6" required>
          </div>
          <div class="correo">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" autocomplete="email" placeholder="nombre@gamelist.com" required>
          </div>
          <div class="campo">
            <label for="itsonId">ID de ITSON</label>
            <input id="itsonId" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" title="6 dígitos numéricos" aria-describedby="itson-hint" required>
            <span class="field__hint" id="itson-hint">6 dígitos.</span>
          </div>
          <div class="contrasena">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="new-password" minlength="6" aria-describedby="password-hint" required>
            <span class="field__hint" id="password-hint">Mínimo 6 caracteres.</span>
          </div>
          <button class="btn" id="btn-crear" type="submit">Crear cuenta</button>
        </form>

        <p class="crearCuenta">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
